# Linting und Formatprüfung: Ruff für Python, Biome für Markdown/JSON (und künftig JS/HTML/CSS).
# Versionen wie lokal: Ruff aus der VS-Code-Erweiterung, Biome wie $schema in biome.json.
name: Lint

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - run: pip install ruff==0.17.4

      - run: ruff check --output-format=github .

      - run: ruff format --check .

  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: npx --yes @biomejs/biome@2.6.6 ci --error-on-warnings .
